services:
    web:
        image: nginx
        container_name: mdl-web
        volumes:
            - .:/var/www
            - ./site.conf:/etc/nginx/conf.d/default.conf
        ports:
            - "8000:80"
        networks:
            - dev
    php:
        build:
            context: ./docker/php
        container_name: mdl-php
        user: '${USER_ID}:${GROUP_ID}'
        volumes:
            - .:/var/www/html
        expose:
            - 9000
        networks:
            - dev
    assets:
        image: node
        container_name: mdl-assets
        user: '${USER_ID}:${GROUP_ID}'
        working_dir: /home/node/app
        volumes:
            - .:/home/node/app
        ports:
            - "5173:5173"
        command: 'sh -c "make docker-assets"'
        networks:
            - dev

networks:
    dev:
        driver: bridge
